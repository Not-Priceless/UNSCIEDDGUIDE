<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>88th Fleet IEDD</title>
<link rel="icon" type="image/png" href="image.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #03080f;
    --surface:   #060e1a;
    --panel:     #091524;
    --panel2:    #0d1c2e;
    --border:    #0e3a5c;
    --border2:   #1a5580;
    --accent:    #00c8ff;
    --accent2:   #0090cc;
    --accent-dim:#004a6e;
    --warn:      #ffcc00;
    --text:      #b8d8e8;
    --muted:     #3d6a84;
    --white:     #e0f4ff;
    --grid:      rgba(0,180,255,0.04);
  }

  body {
    font-family: 'Share Tech Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    /* subtle grid overlay */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(180deg, #071628 0%, #040d18 100%);
    border-bottom: 2px solid var(--accent);
    padding: 0 1.5rem;
    display: flex; align-items: center; gap: 1.2rem;
    height: 62px;
    position: relative;
    box-shadow: 0 0 24px rgba(0,200,255,0.18);
  }
  /* corner tick marks like the HUD in the image */
  header::before, header::after {
    content: ''; position: absolute; bottom: -6px;
    width: 12px; height: 6px;
    background: var(--accent);
  }
  header::before { left: 2rem; }
  header::after  { right: 2rem; }

  .header-left {
    display: flex; flex-direction: column; line-height: 1;
  }
  .header-unit {
    font-family: 'Share Tech Mono', monospace;
    font-size: .6rem; color: var(--accent2);
    letter-spacing: .18em; text-transform: uppercase;
  }
  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.35rem; font-weight: 900;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--white);
    text-shadow: 0 0 14px rgba(0,200,255,0.5);
  }
  .header-badge {
    margin-left: auto;
    border: 1px solid var(--border2);
    background: rgba(0,200,255,0.08);
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: .6rem; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    padding: 4px 10px;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
  }
  .header-ref {
    font-size: .6rem; color: var(--muted);
    letter-spacing: .1em; text-transform: uppercase;
    line-height: 1.3; text-align: right;
  }
  .header-ref span { display: block; color: var(--accent2); }

  /* ── TABS ── */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; overflow-x: auto;
    scrollbar-width: none; padding: 0 1rem;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0; background: none; border: none;
    color: var(--muted);
    font-family: 'Orbitron', sans-serif;
    font-size: .72rem; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase;
    padding: 14px 16px 12px; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s, text-shadow .15s;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    text-shadow: 0 0 10px rgba(0,200,255,0.6);
  }

  /* ── PAGES ── */
  .page { display: none; padding: 2rem; }
  .page.active { display: block; }

  /* ── CATEGORY HERO ── */
  .cat-hero {
    display: flex; align-items: flex-start; gap: 2rem;
    margin-bottom: 2.5rem; padding-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  /* corner bracket decoration */
  .cat-hero::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 20px; height: 20px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
  }
  .cat-hero-img {
    width: 160px; height: 120px;
    background: var(--panel);
    border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: .7rem;
    flex-shrink: 0; overflow: hidden;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  }
  .cat-hero-img img { width: 100%; height: 100%; object-fit: contain; }
  .cat-hero-info { flex: 1; padding-top: .3rem; }
  .cat-hero h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.9rem; font-weight: 900;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--white); line-height: 1; margin-bottom: .6rem;
    text-shadow: 0 0 18px rgba(0,200,255,0.35);
  }
  .cat-notes-static {
    background: rgba(0,150,200,0.07);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--accent);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: .82rem;
    line-height: 1.6;
    padding: .6rem .9rem;
    margin-top: .3rem;
    position: relative;
  }
  .cat-notes-static::before {
    content: '// NOTE';
    position: absolute; top: -9px; left: 8px;
    background: var(--bg);
    font-size: .6rem; color: var(--accent2);
    letter-spacing: .15em; padding: 0 4px;
  }

  /* ── VARIATIONS GRID ── */
  .section-label {
    font-family: 'Orbitron', sans-serif;
    font-size: .65rem; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent2); margin-bottom: 1rem;
    display: flex; align-items: center; gap: .6rem;
  }
  .section-label::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .variations {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.2rem;
  }
  .var-card {
    background: var(--panel);
    border: 1px solid var(--border);
    overflow: hidden; cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .15s;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    position: relative;
  }
  .var-card::before {
    content: '';
    position: absolute; top: 0; right: 0;
    border-style: solid;
    border-width: 0 12px 12px 0;
    border-color: transparent var(--border) transparent transparent;
    z-index: 1;
  }
  .var-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(0,200,255,0.2);
    transform: translateY(-2px);
  }
  .var-card:hover::before { border-color: transparent var(--accent) transparent transparent; }
  .var-thumb {
    width: 100%; height: 320px;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: .75rem; overflow: hidden;
  }
  .var-thumb img { width: 100%; height: 100%; object-fit: contain; }
  .var-label {
    padding: .6rem .9rem;
    font-family: 'Orbitron', sans-serif;
    font-size: .72rem; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--text);
    background: var(--panel2);
    border-top: 1px solid var(--border);
  }
  .var-label .arrow { color: var(--accent); font-size: 1rem; }

  /* ── DETAIL PAGE ── */
  #detail-page { display: none; padding: 2rem; max-width: 760px; }
  #detail-page.active { display: block; }

  .back-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--accent2);
    font-family: 'Orbitron', sans-serif;
    font-size: .65rem; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 7px 16px; cursor: pointer;
    margin-bottom: 1.8rem;
    display: inline-flex; align-items: center; gap: .5rem;
    transition: color .15s, border-color .15s, box-shadow .15s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }
  .back-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(0,200,255,0.25);
  }

  #detail-page h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.7rem; font-weight: 900;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--white); margin-bottom: .25rem;
    text-shadow: 0 0 16px rgba(0,200,255,0.35);
  }
  #detail-page .detail-sub {
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: .78rem;
    margin-bottom: .8rem;
    letter-spacing: .06em;
  }

  .detail-notes-static {
    background: rgba(0,150,200,0.07);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--warn);
    color: var(--warn);
    font-family: 'Share Tech Mono', monospace;
    font-size: .84rem;
    line-height: 1.6;
    padding: .65rem .9rem;
    margin-bottom: 1.6rem;
    margin-top: .4rem;
    position: relative;
  }
  .detail-notes-static::before {
    content: '// FIELD NOTE';
    position: absolute; top: -9px; left: 8px;
    background: var(--bg);
    font-size: .6rem; color: var(--warn);
    letter-spacing: .15em; padding: 0 4px;
  }

  .steps-label {
    font-family: 'Orbitron', sans-serif;
    font-size: .65rem; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent2); margin-bottom: .8rem;
    display: flex; align-items: center; gap: .6rem;
    padding-top: .8rem;
    border-top: 1px solid var(--border);
  }
  .steps-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .checklist {
    list-style: none;
    display: flex; flex-direction: column; gap: .6rem;
  }
  .checklist li {
    display: flex; align-items: flex-start; gap: 1rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent-dim);
    padding: .8rem 1.1rem;
    line-height: 1.5; font-size: .88rem;
    font-family: 'Share Tech Mono', monospace;
    transition: border-left-color .15s, background .15s;
  }
  .checklist li:hover { border-left-color: var(--accent); background: var(--panel2); }
  .checklist li .num {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem; font-weight: 700;
    color: var(--accent); min-width: 26px; line-height: 1.3;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

  @media (max-width: 600px) {
    .cat-hero { flex-direction: column; align-items: flex-start; gap: 1rem; }
    .cat-hero-img { width: 100%; height: 160px; }
    .tab-btn { padding: 12px 10px 10px; font-size: .65rem; }
    header h1 { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-unit">UNSC // 88th Fleet</span>
    <h1>88th Fleet IEDD</h1>
  </div>
  <div class="header-badge">Reference</div>
  <div class="header-ref">
    FILE REF:<span>UNICOM\88FLT\IEDD\REF</span>
  </div>
</header>

<nav id="tab-bar">
  <button class="tab-btn active" data-cat="plastic">Plastic</button>
  <button class="tab-btn" data-cat="fuel">Fuel</button>
  <button class="tab-btn" data-cat="cardboard">Cardboard</button>
  <button class="tab-btn" data-cat="cinderblock">Cinder Block</button>
  <button class="tab-btn" data-cat="bucket">Bucket</button>
  <button class="tab-btn" data-cat="plasticbarrel">Plastic Barrel</button>
  <button class="tab-btn" data-cat="metalbarrel">Metal Barrel</button>
  <button class="tab-btn" data-cat="vests">Vests</button>
  <button class="tab-btn" data-cat="vehicles">Vehicles</button>
</nav>

<div id="catalog-view"></div>

<div id="detail-page">
  <button class="back-btn" id="back-btn">&#8592; Back</button>
  <h2 id="detail-title"></h2>
  <p class="detail-sub" id="detail-sub"></p>
  <div class="detail-notes-static" id="detail-notes"></div>
  <span class="steps-label">Steps</span>
  <ul class="checklist" id="detail-list"></ul>
</div>

<script>
const categories = [
  { id: 'plastic',       label: 'Plastic',       img: 'plastic.png',       note: 'Trigger is always on the front face of the container. Look at the lone wire near top cylinder to quickly identify variation.' },
  { id: 'fuel',          label: 'Fuel',           img: 'fuel.png',          note: 'Trigger is always on the front face. Look at the wire right after the long red wire to quickly identify variation.' },
  { id: 'cardboard',     label: 'Cardboard',      img: 'cardboard.png',     note: 'Trigger is inside the box. Look at the center wires to quickly identify variation.' },
  { id: 'cinderblock',   label: 'Cinder Block',   img: 'cinderblock.png',   note: 'Trigger is inside the block. Look at the wires bent in the corner to quickly identify variation.'},
  { id: 'bucket',        label: 'Bucket',         img: 'bucket.png',        note: 'Only Sapper should open lid. Best if these are detonated in place, or relocated and detonated. Look at the wire under the center black wire to quickly identify variation.' },
  { id: 'plasticbarrel', label: 'Plastic Barrel', img: 'plasticbarrel.png', note: '2 Color Variations, Same trigger. Look at either top wire to quickly identify variation.' },
  { id: 'metalbarrel',   label: 'Metal Barrel',   img: 'metalbarrel.png',   note: 'They all look the same. Trigger is inside the barrel. Look at the shortest wire on the side with the 2 long wires to quickly identify variation.' },
  { id: 'vests',         label: 'Vests',          img: 'vests.png',         note: 'DO NOT injure/shoot/kill subject, the vest will detonate. Look at the two center wires to quickly identify variation.' },
  { id: 'vehicles',      label: 'Vehicles',       img: 'vehicles.png',      note: 'DO NOT enter/move/start the vehicle, the VBIED will detonate. Trigger is the same. Location may change. Look at the two center wires to quickly identify variation.' },
];

// Variation notes
const varNotes = {
  plastic_1: 'Moveable',
  plastic_2: 'Not Moveable',
  plastic_3: 'Not Moveable',
  plastic_4: 'Not Moveable',
  plastic_5: 'Not Moveable',

  fuel_1: 'Not Moveable',
  fuel_2: 'Not Moveable',
  fuel_3: 'Not Moveable',
  fuel_4: 'Moveable',
  fuel_5: 'Not Moveable',

  cardboard_1: 'Not Moveable',
  cardboard_2: 'Not Moveable',
  cardboard_3: 'Not Moveable',
  cardboard_4: 'Not Moveable',
  cardboard_5: 'Not Moveable',

  cinderblock_1: 'Not Moveable',
  cinderblock_2: 'Not Moveable',
  cinderblock_3: 'Moveable',
  cinderblock_4: 'Not Moveable',
  cinderblock_5: 'Not Moveable',

  bucket_1: 'Not Moveable',
  bucket_2: 'Moveable',
  bucket_3: 'Moveable',
  bucket_4: 'Moveable',
  bucket_5: 'Not Moveable',

  plasticbarrel_1: 'Not Moveable',
  plasticbarrel_2: 'Not Moveable',
  plasticbarrel_3: 'Not Moveable',
  plasticbarrel_4: 'Not Moveable',
  plasticbarrel_5: 'Moveable',

  metalbarrel_1: 'Not Moveable',
  metalbarrel_2: 'Not Moveable',
  metalbarrel_3: 'Not Moveable',
  metalbarrel_4: 'Not Moveable',
  metalbarrel_5: 'Not Moveable',

  vests_1: 'Handcuff Subject. DO NOT MOVE. Remember to detach the device once defused.',
  vests_2: 'Handcuff Subject. DO NOT MOVE. Remember to detach the device once defused.',
  vests_3: 'Handcuff Subject. DO NOT MOVE. Remember to detach the device once defused.',
  vests_4: 'Handcuff Subject. DO NOT MOVE. Remember to detach the device once defused.',
  vests_5: 'Handcuff Subject. DO NOT MOVE. Remember to detach the device once defused.',

  vehicles_1: 'Not Moveable',
  vehicles_2: 'Not Moveable',
  vehicles_3: 'Not Moveable',
  vehicles_4: 'Not Moveable',
  vehicles_5: 'Not Moveable',
};

const stepData = {
  plastic_1:       ['Green','Long Black','Blue','Black','Red','Yellow','Long Red'],
  plastic_2:       ['Long Red','Black','Yellow','Blue','Green','Red','Long Black'],
  plastic_3:       ['Yellow','Long Black','Black','Blue', 'Red', 'Green','Long Red'],
  plastic_4:       ['Black','Blue','Long Red','Red','Long Black','Yellow','Green'],
  plastic_5:       ['Green','Long Black','Black','Blue','Yellow','Long Red','Red'],

  fuel_1:          ['Green','Black','Long Red','Yellow','Red','Blue','Long Black'],
  fuel_2:          ['Long Black','Red','Long Red','Green','Black','Yellow','Blue'],
  fuel_3:          ['Green','Red','Black','Blue','Yellow','Long Black','Long Red'],
  fuel_4:          ['Long Black','Green','Blue','Red','Black','Yellow','Long Red'],
  fuel_5:          ['Red','Blue','Yellow','Green','Long Red','Black','Long Black'],

  cardboard_1:     ['Long Black','Long Red','Blue','Black','Yellow','Green','Red'],
  cardboard_2:     ['Red','Black','Green','Long Black','Long Red','Blue','Yellow'],
  cardboard_3:     ['Blue','Green','Long Red','Yellow','Black','Red','Long Black'],
  cardboard_4:     ['Blue','Long Black','Red','Green','Black','Long Red','Yellow'],
  cardboard_5:     ['Long Black','Green','Yellow','Long Red','Blue','Red','Black'],

  cinderblock_1:   ['Long Red','Red','Black','Long Black','Green','Blue','Yellow'],
  cinderblock_2:   ['Red','Yellow','Long Red','Blue','Black','Green','Long Black'],
  cinderblock_3:   ['Black','Red','Blue','Green','Long Red','Yellow','Long Black'],
  cinderblock_4:   ['Blue','Long Red','Yellow','Long Black','Red','Green','Black'],
  cinderblock_5:   ['Black','Red','Blue','Yellow','Green','Long Black','Long Red'],

  bucket_1:        ['Blue','Yellow','Red','Long Red','Black','Long Black','Green'],
  bucket_2:        ['Long Red','Long Black','Yellow','Blue','Red','Green','Black'],
  bucket_3:        ['Yellow','Red','Green','Long Black','Blue','Black','Long Red'],
  bucket_4:        ['Red','Green','Yellow','Black','Long Black','Long Red','Blue'],
  bucket_5:        ['Long Black','Long Red','Blue','Red','Yellow','Green','Black'],

  plasticbarrel_1: ['Long Black','Black','Yellow','Blue','Long Red','Red','Green'],
  plasticbarrel_2: ['Long Red','Blue','Black','Green','Long Black','Red','Yellow'],
  plasticbarrel_3: ['Long Black','Blue','Yellow','Red','Green','Long Red','Black'],
  plasticbarrel_4: ['Yellow','Red','Long Red','Green','Black','Blue','Long Black'],
  plasticbarrel_5: ['Black','Long Red','Yellow','Green','Red','Blue','Long Black'],

  metalbarrel_1:   ['Long Black','Green','Yellow','Black','Blue','Red','Long Red'],
  metalbarrel_2:   ['Green','Black','Yellow','Long Red','Blue','Red','Long Black'],
  metalbarrel_3:   ['Blue','Long Red','Red','Black','Long Black','Green','Yellow'],
  metalbarrel_4:   ['Green','Yellow','Long Red','Long Black','Black','Blue','Red'],
  metalbarrel_5:   ['Black','Long Black','Blue','Red','Green','Yellow','Long Red'],

  vests_1:         ['Short Red','Green','Yellow','Short Black','Red','Black','Blue'],
  vests_2:         ['Red','Yellow','Blue','Short Black','Black','Green','Short Red'],
  vests_3:         ['Blue','Black','Yellow','Red','Short Red','Green','Short Black'],
  vests_4:         ['Black','Short Red','Red','Short Black','Green','Yellow','Blue'],
  vests_5:         ['Green','Red','Black','Yellow','Blue','Short Black','Short Red'],

  vehicles_1:      ['Long Red','Red','Blue','Green','Black','Yellow','Long Black'],
  vehicles_2:      ['Yellow','Green','Long Red','Red','Long Black','Blue','Black'],
  vehicles_3:      ['Black','Long Black','Yellow','Red','Green','Blue','Long Red'],
  vehicles_4:      ['Black','Long Black','Blue','Green','Red','Long Red','Yellow'],
  vehicles_5:      ['Red','Long Black','Blue','Black','Yellow','Green','Long Red'],
};

function varImg(catId, n) { return `${catId}_var${n}.png`; }

// Build pages
const catalogView = document.getElementById('catalog-view');

categories.forEach(cat => {
  const page = document.createElement('div');
  page.className = 'page';
  page.id = `page-${cat.id}`;

  const noteHtml = cat.note
    ? `<div class="cat-notes-static">${cat.note}</div>`
    : '';

  page.innerHTML = `
    <div class="cat-hero">
      <div class="cat-hero-img">
        <img src="${cat.img}" alt="${cat.label}" onerror="this.parentElement.textContent='${cat.img}'">
      </div>
      <div class="cat-hero-info">
        <h2>${cat.label}</h2>
        ${noteHtml}
      </div>
    </div>
    <div class="section-label">Variations</div>
    <div class="variations">
      ${[1,2,3,4,5].map(n => `
        <div class="var-card" data-cat="${cat.id}" data-label="${cat.label}" data-var="${n}">
          <div class="var-thumb">
            <img src="${varImg(cat.id, n)}" alt="Variation ${n}"
                 onerror="this.parentElement.textContent='${varImg(cat.id, n)}'">
          </div>
          <div class="var-label">Variation ${n} <span class="arrow">›</span></div>
        </div>
      `).join('')}
    </div>
  `;

  catalogView.appendChild(page);
});

document.getElementById('page-plastic').classList.add('active');

// Tab switching
document.getElementById('tab-bar').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  const cat = btn.dataset.cat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${cat}`).classList.add('active');
  document.getElementById('detail-page').classList.remove('active');
  catalogView.style.display = '';
});

// Variation → detail
catalogView.addEventListener('click', e => {
  const card = e.target.closest('.var-card');
  if (!card) return;

  const catId    = card.dataset.cat;
  const catLabel = card.dataset.label;
  const varNum   = card.dataset.var;
  const noteKey  = `${catId}_${varNum}`;

  document.getElementById('detail-title').textContent = `${catLabel} — Variation ${varNum}`;
  document.getElementById('detail-sub').textContent   = `Category: ${catLabel}  ·  Variation ${varNum} of 5`;

  const noteEl = document.getElementById('detail-notes');
  const noteText = varNotes[noteKey] || '';
  if (noteText) {
    noteEl.textContent = noteText;
    noteEl.style.display = 'block';
  } else {
    noteEl.style.display = 'none';
  }

  document.getElementById('back-btn').dataset.cat = catId;

  const steps = stepData[noteKey] || Array(7).fill('—');
  const list = document.getElementById('detail-list');
  list.innerHTML = steps.map((step, i) =>
    `<li><span class="num">${i+1}</span>Step ${i+1} — ${step}</li>`
  ).join('');

  catalogView.style.display = 'none';
  document.getElementById('detail-page').classList.add('active');
});

// Back
document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('detail-page').classList.remove('active');
  catalogView.style.display = '';
});
</script>
</body>
</html>
